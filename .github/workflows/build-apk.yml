name: Build Android APK

# Builds the Capacitor Android wrapper and commits it to public/ so
# /api/download/apk can serve it. Run manually from the Actions tab.
#
# The APK is a thin shell that loads the deployed site, so it needs the
# public URL of your deployment — not localhost, or the app opens blank
# on a phone.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Public URL the app should load (e.g. https://your-app.vercel.app)"
        required: true
        type: string
      commit_apk:
        description: "Commit the APK to public/ so the in-app download works"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Validate server URL
        run: |
          case "${{ inputs.server_url }}" in
            https://*) ;;
            *) echo "server_url must start with https:// — got '${{ inputs.server_url }}'"; exit 1 ;;
          esac

      - name: Scaffold Android project
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
        run: npx cap add android

      - name: Sync Capacitor
        env:
          CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/sahoda-crm.apk
          ls -lh public/sahoda-crm.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahoda-crm-apk
          path: public/sahoda-crm.apk
          if-no-files-found: error

      - name: Commit APK
        if: ${{ inputs.commit_apk }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/sahoda-crm.apk
          if git diff --staged --quiet; then
            echo "APK unchanged; nothing to commit."
          else
            git commit -m "Build Android APK for ${{ inputs.server_url }}"
            git push
          fi
